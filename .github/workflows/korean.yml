name: Korean adapter

on:
  push:
    paths:
      - 'algorithms/korean.sbl'
      - 'libstemmer/modules.txt'
      - 'examples/korean/**'
      - 'tests/korean/**'
      - 'GNUmakefile'
      - '.github/workflows/korean.yml'
  pull_request:
    paths:
      - 'algorithms/korean.sbl'
      - 'libstemmer/modules.txt'
      - 'examples/korean/**'
      - 'tests/korean/**'
      - 'GNUmakefile'
      - '.github/workflows/korean.yml'
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r examples/korean/requirements.txt
      - run: make -j4 check_korean_adapter python=python
